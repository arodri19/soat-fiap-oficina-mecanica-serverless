name: CD — Deploy Lambda

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Disparo 100% manual — nenhum push/PR aciona plan/apply/destroy automaticamente.
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a executar'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      environment:
        description: 'Ambiente alvo'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

# ── Variáveis globais ──────────────────────────────────────────────────────────
# Secrets (Settings → Secrets):   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#                                  DB_PASSWORD, JWT_SECRET
# Variables (Settings → Variables): AWS_REGION, TF_STATE_BUCKET
env:
  AWS_REGION:         ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET:    ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_jwt_secret:  ${{ secrets.JWT_SECRET }}
  NODE_VERSION:       '20'

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: oficina-prd

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        if: github.event.inputs.action == 'apply'
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Terraform empacota var.lambda_build_path (../dist) direto no zip da Lambda.
      - name: Build do pacote da Lambda
        if: github.event.inputs.action == 'apply'
        run: npm run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina-mecanica/serverless/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        working-directory: terraform
        run: |
          terraform plan -input=false \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="tf_state_bucket=${{ env.TF_STATE_BUCKET }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform
        run: |
          terraform destroy -input=false -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="tf_state_bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Resumo
        if: always()
        run: |
          echo "### Terraform ${{ github.event.inputs.action }} — serverless" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ação | \`${{ github.event.inputs.action }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
